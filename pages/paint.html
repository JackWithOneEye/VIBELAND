<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Paint - VIBELAND</title>
  <link rel="stylesheet" type="text/css" href="../assets/styles.css">
  <style>
    /* --- Classic desktop look --- */
    :root {
      --titlebar: #0a3ea8;
      --titlebar-text: #fff;
      --toolbar: #d4d0c8;
      --button-face: #f0f0f0;
      --accent: #0a3ea8;
    }

    /* The paint window needs more room than the standard page width */
    .container.extra-wide {
      width: 1240px;
    }

    /* Window container */
    .app {
      width: 100%;
      height: 770px;
      border: 2px solid #808080;
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.12);
      background: linear-gradient(#f5f5f5, #ededed);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Title bar */
    .titlebar {
      flex: none;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(var(--titlebar), #0b55d0);
      color: var(--titlebar-text);
      padding: 0 8px;
      user-select: none;
      box-shadow: inset 0 -1px rgba(0, 0, 0, 0.2);
      font-weight: bold;
      font-size: 12px;
    }

    .titlebar .title {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .titlebar .title .icon {
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 2px;
      box-shadow: inset 0 0 0 1px #999
    }

    .titlebar .window-controls {
      display: flex;
      gap: 4px
    }

    .btn-win {
      width: 18px;
      height: 18px;
      border: 1px solid #333;
      background: linear-gradient(#fff, #ddd);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #000
    }

    /* Menu bar */
    .menubar {
      flex: none;
      height: 30px;
      background: var(--toolbar);
      display: flex;
      align-items: stretch;
      padding: 0 6px;
      border-top: 1px solid #9a9a9a
    }

    .menu {
      position: relative;
      display: flex;
    }

    .menu>button {
      background: transparent;
      border: 0;
      padding: 0 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: normal;
    }

    .menu:hover>button {
      background: var(--accent);
      color: #fff;
    }

    .menu>.dropdown {
      position: absolute;
      left: 0;
      top: 100%;
      background: #fff;
      border: 1px solid #888;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.15);
      display: none;
      min-width: 180px;
      padding: 2px 0;
      z-index: 50
    }

    .menu:hover>.dropdown {
      display: block
    }

    .menu.closed>.dropdown {
      display: none
    }

    .dropdown button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 6px 12px;
      border: 0;
      background: transparent;
      font-family: inherit;
      font-size: 12px;
      font-weight: normal;
    }

    .dropdown button:hover:not(:disabled) {
      background: var(--accent);
      color: #fff;
    }

    .dropdown button:disabled {
      color: #999;
      cursor: default;
    }

    .dropdown hr {
      margin: 4px 0;
      height: 1px;
      background: #ddd
    }

    /* Main area */
    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 8px;
      padding: 8px;
      background: linear-gradient(#e0e0e0, #d7d7d7)
    }

    /* Left toolbar: two columns of tools, like the classic tool box */
    .toolbar {
      flex: none;
      align-self: flex-start;
      background: linear-gradient(#e9e9e9, #d9d9d9);
      border: 2px solid #b0b0b0;
      padding: 4px;
      display: grid;
      grid-template-columns: repeat(2, 28px);
      gap: 4px
    }

    .tool {
      width: 28px;
      height: 28px;
      background: var(--button-face);
      border: 1px solid #8f8f8f;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 -1px rgba(0, 0, 0, 0.05)
    }

    .tool.active {
      background: #fff;
      outline: 2px solid var(--accent);
      outline-offset: -2px
    }

    .tool svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #000;
      stroke-linecap: round;
      stroke-linejoin: round;
      overflow: visible
    }

    /* Centre column: controls above the canvas */
    .top-controls {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(#f6f6f6, #ededed);
      padding: 4px 6px;
      border: 1px solid #bdbdbd;
      border-radius: 2px
    }

    .label {
      font-size: 12px;
    }

    .readout {
      font-size: 12px;
      margin-left: auto
    }

    /* Canvas area */
    .canvas-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      background: repeating-linear-gradient(0deg, #fff, #fff 20px, #f8f8f8 20px, #f8f8f8 21px);
      padding: 6px;
      overflow: auto;
      border: 2px solid #9a9a9a
    }

    /* margin:auto centres a small canvas but keeps every edge of a large one scrollable */
    .paper {
      margin: auto;
      position: relative;
      flex: none;
      border: 1px solid #b7b7b7;
      background: #fff;
    }

    /* reset the site-wide canvas border/background: overlays must be transparent and exactly cover the drawing */
    .paper canvas {
      display: block;
      border: 0;
      background: transparent;
      image-rendering: pixelated;
    }

    .paper canvas.overlay {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none
    }

    #canvasMain,
    #canvasMain:active {
      cursor: crosshair;
      touch-action: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .text-editor {
      position: absolute;
      z-index: 10;
      min-width: 40px;
      white-space: pre;
      font-family: Tahoma, Geneva, Verdana, sans-serif;
      background: rgba(255, 255, 255, 0.9);
      border: 1px dashed #000;
      padding: 2px;
      outline: none
    }

    /* Color palette */
    .palette {
      flex: none;
      width: 162px;
      align-self: flex-start;
      background: linear-gradient(#efece8, #e8e5e1);
      padding: 8px;
      border: 2px solid #b0b0b0;
      font-size: 12px
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px
    }

    .swatch {
      height: 18px;
      border: 1px solid #6b6b6b;
      cursor: pointer
    }

    .color-pair {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      font-size: 11px
    }

    .color-box {
      width: 48px;
      height: 28px;
      border: 1px solid #333;
      cursor: pointer
    }

    .color-box.secondary {
      border-style: dashed
    }

    /* Status bar */
    .statusbar {
      flex: none;
      height: 22px;
      background: linear-gradient(#e7e7e7, #d7d7d7);
      display: flex;
      align-items: center;
      padding: 0 8px;
      border-top: 1px solid #9a9a9a;
      font-size: 12px
    }

    .status-left {
      flex: 1
    }

    .status-cell {
      margin-left: 8px;
      padding-left: 8px;
      border-left: 1px solid #aaa
    }

    /* color picker modal */
    .modal {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border: 2px solid #666;
      padding: 12px;
      z-index: 2000;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.2)
    }

    .modal .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px
    }

    /* small helpers */
    button.small {
      padding: 3px 8px;
      font-size: 12px
    }

    input[type=range] {
      width: 110px
    }

    .muted {
      color: #666;
      font-size: 12px
    }
  </style>
</head>

<body>
  <div class="container extra-wide">
    <div class="outer-border">
      <div class="header">
        <h1>🎨 PAINT 🎨</h1>
        <p>~*~ Create Your Masterpiece ~*~</p>
      </div>

      <div class="ticker" aria-label="site news">
        <div class="marquee">★ WELCOME TO VIBELAND ★ DRAW, PAINT & CREATE ★ RETRO STYLE ★</div>
      </div>

      <div class="content">
        <div class="app" role="application" aria-label="Paint">
          <div class="titlebar">
            <div class="title">
              <div class="icon"></div>
              <div class="title-text">Untitled - Paint</div>
            </div>
            <div class="window-controls">
              <div class="btn-win">_</div>
              <div class="btn-win">▢</div>
              <div class="btn-win">✕</div>
            </div>
          </div>

          <div class="menubar" role="menubar">
            <div class="menu"><button>File</button>
              <div class="dropdown" role="menu">
                <button id="newBtn">New</button>
                <button id="openBtn">Open...</button>
                <button id="saveBtn">Save as PNG...</button>
                <hr>
                <button id="exitBtn">Exit</button>
              </div>
            </div>
            <div class="menu"><button>Edit</button>
              <div class="dropdown" role="menu">
                <button id="undoBtn">Undo</button>
                <button id="redoBtn">Redo</button>
                <hr>
                <button id="cutBtn">Cut</button>
                <button id="copyBtn">Copy</button>
                <button id="pasteBtn">Paste</button>
              </div>
            </div>
            <div class="menu"><button>View</button>
              <div class="dropdown" role="menu">
                <button id="zoomIn">Zoom In</button>
                <button id="zoomOut">Zoom Out</button>
                <button id="resetZoom">Actual Size</button>
              </div>
            </div>
            <div class="menu"><button>Image</button>
              <div class="dropdown" role="menu">
                <button id="resizeBtn">Resize...</button>
                <button id="rotateBtn">Rotate...</button>
                <button id="flipHBtn">Flip Horizontal</button>
                <button id="flipVBtn">Flip Vertical</button>
              </div>
            </div>
            <div class="menu"><button>Colors</button>
              <div class="dropdown" role="menu">
                <button id="editColors">Edit Colors...</button>
              </div>
            </div>
            <div class="menu"><button>Help</button>
              <div class="dropdown" role="menu">
                <button id="aboutBtn">About</button>
              </div>
            </div>
          </div>

          <div class="main">
            <div class="toolbar" role="toolbar" aria-label="tools">
              <!-- Icons are drawn on a 20×20 grid at 1 unit = 1 CSS px so strokes stay crisp -->
              <div class="tool" data-tool="select" title="Select (S)">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <rect x="2.5" y="3.5" width="15" height="13" stroke-width="1" stroke-dasharray="2 2" stroke-linecap="butt" />
                </svg>
              </div>
              <div class="tool active" data-tool="pencil" title="Pencil (P)">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <g transform="rotate(-45 10 10)" stroke-width="1">
                    <path d="M15 7.5H6L1.5 10 6 12.5H15Z" fill="#f6c343" />
                    <path d="M6 7.5 1.5 10 6 12.5Z" fill="#f3d6a8" />
                    <path d="M1.5 10 3.3 9V11Z" fill="#000" stroke="none" />
                    <path d="M6.5 10H14.5" stroke="#c98f12" stroke-width="0.8" />
                    <path d="M15 7.5H17.5A1 1 0 0 1 18.5 8.5V11.5A1 1 0 0 1 17.5 12.5H15Z" fill="#f08ca0" />
                  </g>
                </svg>
              </div>
              <div class="tool" data-tool="brush" title="Brush (B)">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <g transform="rotate(-45 10 10)" stroke-width="1">
                    <path d="M9.5 8.9H17.4A1.1 1.1 0 0 1 17.4 11.1H9.5Z" fill="#b8742e" />
                    <path d="M6.5 7.2C3.6 7.2 1.5 8.4 1 10 1.5 11.6 3.6 12.8 6.5 12.8Z" fill="#2f6fd8" />
                    <rect x="6.5" y="7.4" width="3" height="5.2" rx="0.5" fill="#d4d4d4" />
                  </g>
                </svg>
              </div>
              <div class="tool" data-tool="eraser" title="Eraser (E)">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <g transform="rotate(-35 10 9)" stroke-width="1">
                    <rect x="3" y="5.75" width="14" height="6.5" rx="1" fill="#fff" />
                    <path d="M8.5 5.75H4A1 1 0 0 0 3 6.75V11.25A1 1 0 0 0 4 12.25H8.5Z" fill="#f08ca0" />
                  </g>
                  <path d="M2 18.5H18" stroke-width="1" />
                </svg>
              </div>
              <div class="tool" data-tool="fill" title="Fill (F)">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <g transform="rotate(35 8.5 11)" stroke-width="1">
                    <path d="M4 8C4 3.6 13 3.6 13 8" stroke-width="0.9" />
                    <path d="M3.5 8.5H13.5V15.5A1.5 1.5 0 0 1 12 17H5A1.5 1.5 0 0 1 3.5 15.5Z" fill="#e6e6e6" />
                    <ellipse cx="8.5" cy="8.5" rx="5" ry="1.25" fill="#2f6fd8" />
                  </g>
                  <path d="M16.5 10.5C17.6 12.1 18.5 13.4 18.5 14.6A2 2 0 0 1 14.5 14.6C14.5 13.4 15.4 12.1 16.5 10.5Z" fill="#2f6fd8" stroke-width="1" />
                </svg>
              </div>
              <div class="tool" data-tool="eyedrop" title="Color Picker (I)">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <g transform="rotate(45 10 10)" stroke-width="1">
                    <path d="M8.25 2.5A1.75 1.75 0 0 1 11.75 2.5V6.5H8.25Z" fill="#333" />
                    <rect x="6.5" y="6.5" width="7" height="1.75" rx="0.6" fill="#888" />
                    <path d="M8.75 8.25H11.25V15L10 18 8.75 15Z" fill="#fff" />
                    <path d="M9.25 12.5H10.75V15L10 16.8 9.25 15Z" fill="#2f6fd8" stroke="none" />
                  </g>
                </svg>
              </div>
              <div class="tool" data-tool="text" title="Text (T)">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M4.5 16.5 10 3.5 15.5 16.5M6.6 11.5H13.4M2.75 16.5H6.25M13.75 16.5H17.25" stroke-width="1.5" />
                </svg>
              </div>
              <div class="tool" data-tool="line" title="Line (L)">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M3.5 16.5 16.5 3.5" stroke-width="1.5" />
                </svg>
              </div>
              <div class="tool" data-tool="curve" title="Curve (C)">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M2.75 15.5C4.5 6 8 4 10 10S15.5 14 17.25 4.5" stroke-width="1.5" />
                </svg>
              </div>
              <div class="tool" data-tool="polygon" title="Polygon (Y)">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M3.25 7.25 10.25 2.75 16.75 7.75 14.25 16.75 5.75 15.25Z" stroke-width="1.5" />
                </svg>
              </div>
              <div class="tool" data-tool="rect" title="Rectangle (R)">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <rect x="2.75" y="4.75" width="14.5" height="10.5" stroke-width="1.5" />
                </svg>
              </div>
              <div class="tool" data-tool="ellipse" title="Ellipse (O)">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <ellipse cx="10" cy="10" rx="7.25" ry="5.25" stroke-width="1.5" />
                </svg>
              </div>
            </div>

            <div class="top-controls">
              <div class="controls-row">
                <div class="control-group">
                  <span class="label">Size</span>
                  <input id="sizeRange" type="range" min="1" max="80" value="4">
                </div>
                <div class="control-group">
                  <span class="label">Mode</span>
                  <select id="drawMode">
                    <option value="stroke">Outline</option>
                    <option value="fill">Filled</option>
                    <option value="stroke-fill">Outline + Fill</option>
                  </select>
                </div>
                <div class="control-group">
                  <button id="undoBtn2" class="small">Undo</button>
                  <button id="redoBtn2" class="small">Redo</button>
                </div>
                <div class="control-group">
                  <button id="openFileBtn" class="small">Open</button>
                  <button id="saveFileBtn" class="small">Save</button>
                </div>
                <div class="readout">Tool: <strong id="currentToolName">Pencil</strong> &nbsp; Zoom: <strong id="zoomLabel">100%</strong></div>
              </div>

              <div class="canvas-wrap" id="canvasWrap">
                <div class="paper" id="paper">
                  <canvas id="canvasMain" draggable="false"></canvas>
                  <canvas id="canvasTemp" class="overlay"></canvas>
                  <canvas id="canvasSel" class="overlay"></canvas>
                </div>
              </div>
            </div>

            <div class="palette" aria-label="colors">
              <div style="font-size:13px;margin-bottom:8px">Colors</div>
              <div class="swatches" id="swatches"></div>
              <div class="color-pair">
                <div>
                  <div>Primary</div>
                  <div id="primaryColor" class="color-box" title="Primary color (click to swap)"></div>
                </div>
                <div>
                  <div>Secondary</div>
                  <div id="secondaryColor" class="color-box secondary" title="Secondary color (click to swap)"></div>
                </div>
              </div>
              <div style="margin-top:10px">
                <button id="editColorsBtn" class="small">Edit Colors...</button>
              </div>
            </div>
          </div>

          <div class="statusbar">
            <div class="status-left" id="statusLeft">Ready</div>
            <div id="statusRight">0,0</div>
            <div class="status-cell"><span id="zoomLabel2">100%</span></div>
          </div>
        </div>

        <hr class="thick">

        <div class="footer">
          <div><a href="../home">← Back to VIBELAND</a></div>
          <div>© 1999 VIBELAND - All Rights Reserved</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden file input for opening images -->
  <input id="fileInput" type="file" accept="image/*" style="display:none" />

  <!-- Color Picker Modal -->
  <div id="colorModal" class="modal" style="display:none">
    <div style="font-weight:bold;margin-bottom:6px">Edit Colors</div>
    <div class="row">
      <div>
        <input id="colorInput" type="color" style="width:56px;height:34px;border:0;padding:0">
      </div>
      <div style="flex:1">
        <div class="row"><label class="muted">Hex</label><input id="hexInput" type="text" style="width:120px"></div>
        <div class="row"><label class="muted">R</label><input id="rRange" type="range" min="0" max="255"></div>
        <div class="row"><label class="muted">G</label><input id="gRange" type="range" min="0" max="255"></div>
        <div class="row"><label class="muted">B</label><input id="bRange" type="range" min="0" max="255"></div>
      </div>
    </div>
    <div style="text-align:right;margin-top:8px"><button id="colorOk" class="small">OK</button> <button id="colorCancel"
        class="small">Cancel</button></div>
  </div>

  <script>
    (function () {
      const $ = id => document.getElementById(id);
      const canvasMain = $("canvasMain");
      const canvasTemp = $("canvasTemp");
      const canvasSel = $("canvasSel");
      const canvasWrap = $("canvasWrap");
      const paper = $("paper");
      const primaryBox = $("primaryColor");
      const secondaryBox = $("secondaryColor");
      const statusLeft = $("statusLeft");
      const statusRight = $("statusRight");
      const colorModal = $("colorModal");
      const colorInput = $("colorInput");
      const hexInput = $("hexInput");
      const rRange = $("rRange");
      const gRange = $("gRange");
      const bRange = $("bRange");
      const fileInput = $("fileInput");
      const sizeRange = $("sizeRange");
      const drawModeSel = $("drawMode");

      // Every canvas has a backing store of (logical size × DPR); all drawing uses logical coordinates.
      const DPR = window.devicePixelRatio || 1;
      const ctx = canvasMain.getContext("2d", { willReadFrequently: true });
      const tctx = canvasTemp.getContext("2d");
      const sctx = canvasSel.getContext("2d");

      let W = 900, H = 600; // logical canvas size
      let zoom = 1;
      let tool = "pencil";
      let primary = "#000000";
      let secondary = "#ffffff";
      let size = 4;
      let drawMode = "stroke";

      let activePointer = null; // pointer id of the drag in progress
      let strokeColor = primary; // colour chosen by the mouse button that started the drag
      let start = { x: 0, y: 0 };
      let last = { x: 0, y: 0 };
      let polyPoints = []; // polygon / curve points in progress
      let polyColor = primary;
      let selection = null; // {x, y, w, h, angle, img: device-resolution canvas, floating}
      let selDrag = null; // {type: "new"|"move"|"handle"|"rotate", handle, startPos, startSel}
      let copied = null; // {img, w, h}
      let textEditor = null;

      const undoStack = [];
      const redoStack = [];
      const MAX_UNDO = 60;

      // ---------- canvas sizing & zoom ----------
      function setSize(w, h) {
        W = w; H = h;
        for (const c of [canvasMain, canvasTemp, canvasSel]) {
          c.width = Math.round(w * DPR);
          c.height = Math.round(h * DPR);
          c.getContext("2d").setTransform(DPR, 0, 0, DPR, 0, 0);
        }
        applyZoom();
      }
      function applyZoom() {
        for (const c of [canvasMain, canvasTemp, canvasSel]) {
          c.style.width = W * zoom + "px";
          c.style.height = H * zoom + "px";
        }
      }
      function setZoom(z) {
        zoom = Math.max(0.25, Math.min(4, z));
        applyZoom();
        $("zoomLabel").textContent = $("zoomLabel2").textContent = Math.round(zoom * 100) + "%";
      }
      function clearCanvas(g) { g.clearRect(0, 0, W, H); }
      function fillWhite(x = 0, y = 0, w = W, h = H) { ctx.fillStyle = "#ffffff"; ctx.fillRect(x, y, w, h); }
      // Copy of the main canvas (or a region of it) at full device resolution
      function snapshotCanvas(x = 0, y = 0, w = W, h = H) {
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(w * DPR));
        c.height = Math.max(1, Math.round(h * DPR));
        c.getContext("2d").drawImage(canvasMain, Math.round(x * DPR), Math.round(y * DPR), c.width, c.height, 0, 0, c.width, c.height);
        return c;
      }

      setSize(W, H);
      fillWhite();

      function updateStatus(text) { statusLeft.textContent = text; }
      function getPos(e) {
        const r = canvasMain.getBoundingClientRect();
        return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
      }
      const clampX = x => Math.max(0, Math.min(W, x));
      const clampY = y => Math.max(0, Math.min(H, y));

      // ---------- colours ----------
      const defaultColors = ["#000000", "#808080", "#800000", "#ff0000", "#808000", "#ffff00", "#008000", "#00ff00", "#008080", "#00ffff", "#000080", "#0000ff", "#800080", "#ff00ff", "#808040", "#ffffff", "#c0c0c0", "#ffb6c1", "#ffd700", "#f0e68c", "#add8e6", "#87ceeb", "#98fb98", "#90ee90", "#ffe4b5", "#ffdead", "#ffe4e1", "#faf0e6", "#f5f5dc", "#dcdcdc", "#e6e6fa", "#fffacd", "#e0ffff", "#f0fff0", "#fff0f5", "#f5f5f5"];
      for (const c of defaultColors) {
        const d = document.createElement("div");
        d.className = "swatch";
        d.style.background = c;
        d.title = c;
        d.addEventListener("click", () => setPrimary(c));
        d.addEventListener("contextmenu", ev => { ev.preventDefault(); setSecondary(c); });
        $("swatches").appendChild(d);
      }
      function setPrimary(c) { primary = c; primaryBox.style.background = c; }
      function setSecondary(c) { secondary = c; secondaryBox.style.background = c; }
      setPrimary(primary); setSecondary(secondary);
      function swapColors() { const tmp = primary; setPrimary(secondary); setSecondary(tmp); }
      primaryBox.addEventListener("click", swapColors);
      secondaryBox.addEventListener("click", swapColors);

      // ---------- tools ----------
      function setTool(name) {
        commitSelection();
        cancelPoly();
        tool = name;
        document.querySelectorAll(".tool").forEach(t => t.classList.toggle("active", t.dataset.tool === name));
        $("currentToolName").textContent = document.querySelector(`.tool[data-tool='${name}']`).title.replace(/\s*\(.*\)$/, "");
      }
      document.querySelectorAll(".tool").forEach(el => el.addEventListener("click", () => setTool(el.dataset.tool)));
      sizeRange.addEventListener("input", () => { size = parseInt(sizeRange.value, 10); });
      drawModeSel.addEventListener("change", () => { drawMode = drawModeSel.value; });

      // ---------- undo / redo (snapshots remember the canvas size) ----------
      function snapshot() { return { w: W, h: H, data: ctx.getImageData(0, 0, canvasMain.width, canvasMain.height) }; }
      function restore(s) {

      function pushUndo() {

      }
      function undo() {
        commitSelection();
        cancelPoly();

        redoStack.push(snapshot());
        restore(undoStack.pop());
        updateStatus("Undid");
        updateUndoButtons();
      }
      function redo() {
        commitSelection();
        cancelPoly();
        if (!redoStack.length) return;
        undoStack.push(snapshot());
        restore(redoStack.pop());
        updateStatus("Redid");
        updateUndoButtons();
      }
      function updateUndoButtons() {
        $("undoBtn").disabled = $("undoBtn2").disabled = undoStack.length === 0;
        $("redoBtn").disabled = $("redoBtn2").disabled = redoStack.length === 0;
      }
      $("undoBtn").addEventListener("click", undo); $("undoBtn2").addEventListener("click", undo);
      $("redoBtn").addEventListener("click", redo); $("redoBtn2").addEventListener("click", redo);

      // ---------- file ----------
      function openFile() { fileInput.click(); }
      $("openBtn").addEventListener("click", openFile);
      $("openFileBtn").addEventListener("click", openFile);
      fileInput.addEventListener("change", () => {
        const f = fileInput.files[0];
        fileInput.value = ""; // allow re-opening the same file
        if (!f) return;
        const url = URL.createObjectURL(f);
        const img = new Image();
        img.onload = () => {
          commitSelection();
          pushUndo();
          fillWhite();
          const scale = Math.min(W / img.width, H / img.height, 1);
          ctx.drawImage(img, 0, 0, img.width * scale, img.height * scale);
          URL.revokeObjectURL(url);
          updateStatus("Image opened");

        img.onerror = () => { URL.revokeObjectURL(url); updateStatus("Could not open that file"); };
        img.src = url;
      });
      function saveAsPNG() {
        commitSelection();
        const tmp = document.createElement("canvas");
        tmp.width = W; tmp.height = H;
        tmp.getContext("2d").drawImage(canvasMain, 0, 0, W, H);
        const link = document.createElement("a");
        link.download = "painting.png";
        link.href = tmp.toDataURL("image/png");
        link.click();
      }
      $("saveBtn").addEventListener("click", saveAsPNG);
      $("saveFileBtn").addEventListener("click", saveAsPNG);

      $("newBtn").addEventListener("click", () => {
        if (!confirm("Create new image? Unsaved changes will be lost.")) return;
        clearSelection();
        cancelPoly();
        pushUndo();
        fillWhite();
      });
      $("exitBtn").addEventListener("click", () => { if (confirm("Close Paint?")) location.href = "../home"; });
      $("aboutBtn").addEventListener("click", () => alert("VIBELAND Paint — a retro paint program in HTML/JS"));

      // Close a dropdown after choosing an item (it reopens on the next hover)
      document.querySelectorAll(".menu").forEach(m => {
        m.querySelector(".dropdown").addEventListener("click", () => m.classList.add("closed"));
        m.addEventListener("mouseleave", () => m.classList.remove("closed"));
      });

      // ---------- view ----------
      $("zoomIn").addEventListener("click", () => setZoom(zoom * 1.25));
      $("zoomOut").addEventListener("click", () => setZoom(zoom / 1.25));
      $("resetZoom").addEventListener("click", () => setZoom(1));

      // ---------- image ----------
      function flip(horizontal) {
        commitSelection();
        pushUndo();
        const src = snapshotCanvas();
        ctx.save();
        ctx.setTransform(horizontal ? -1 : 1, 0, 0, horizontal ? 1 : -1, horizontal ? canvasMain.width : 0, horizontal ? 0 : canvasMain.height);
        ctx.drawImage(src, 0, 0);
        ctx.restore();
      }
      $("flipHBtn").addEventListener("click", () => flip(true));
      $("flipVBtn").addEventListener("click", () => flip(false));
      $("resizeBtn").addEventListener("click", () => {
        const w = parseInt(prompt("New width (px):", W), 10);
        const h = parseInt(prompt("New height (px):", H), 10);
        if (!(w > 0 && h > 0 && w <= 4000 && h <= 4000)) return;
        commitSelection();
        pushUndo();
        const src = snapshotCanvas();
        setSize(w, h);
        fillWhite();
        ctx.drawImage(src, 0, 0, w, h);
      });
      $("rotateBtn").addEventListener("click", () => {
        const angle = parseFloat(prompt("Rotate (degrees, positive = clockwise):", "90"));
        if (isNaN(angle)) return;
        commitSelection();
        pushUndo();
        const rad = angle * Math.PI / 180;
        const sin = Math.abs(Math.sin(rad)), cos = Math.abs(Math.cos(rad));
        const w = W, h = H;
        const src = snapshotCanvas();
        setSize(Math.ceil(w * cos + h * sin - 1e-6), Math.ceil(w * sin + h * cos - 1e-6));
        fillWhite();
        ctx.save();
        ctx.translate(W / 2, H / 2);
        ctx.rotate(rad);
        ctx.drawImage(src, -w / 2, -h / 2, w, h);
        ctx.restore();
      });

      // ---------- drawing helpers ----------
      function drawLine(g, x1, y1, x2, y2, color, width) {
        g.save();
        g.lineCap = "round"; g.lineJoin = "round";
        g.strokeStyle = color; g.lineWidth = width;
        g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
        g.restore();
      }
      // Rectangle / ellipse / closed polygon honouring the Mode setting
      function paintShape(g, color, buildPath) {
        g.save();
        g.lineWidth = size; g.lineJoin = "round";
        g.strokeStyle = g.fillStyle = color;
        g.beginPath(); buildPath(g);
        if (drawMode !== "stroke") g.fill();
        if (drawMode !== "fill") g.stroke();
        g.restore();
      }
      function drawShape(g, kind, a, b, color) {
        const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y), w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
        if (kind === "line") drawLine(g, a.x, a.y, b.x, b.y, color, size);
        else if (kind === "rect") paintShape(g, color, p => p.rect(x, y, w, h));
        else paintShape(g, color, p => p.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2));
      }
      // Polyline (polygon) or smooth Catmull-Rom curve through the points
      function tracePath(g, pts, smooth) {
        g.moveTo(pts[0][0], pts[0][1]);
        for (let i = 0; i < pts.length - 1; i++) {
          const p1 = pts[i], p2 = pts[i + 1];
          if (!smooth) { g.lineTo(p2[0], p2[1]); continue; }
          const p0 = pts[i - 1] || p1, p3 = pts[i + 2] || p2;
          g.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
        }
      }
      function hexToRgba(hex) {
        let c = hex.replace("#", "");
        if (c.length === 3) c = c.split("").map(ch => ch + ch).join("");
        const n = parseInt(c, 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255, 255];
      }

      // Flood fill with a small colour tolerance so anti-aliased edges don't leave a light halo
      function floodFill(x, y, fillColor) {
        const w = canvasMain.width, h = canvasMain.height;
        const px = Math.floor(x * DPR), py = Math.floor(y * DPR);
        if (px < 0 || py < 0 || px >= w || py >= h) return;
        const img = ctx.getImageData(0, 0, w, h), d = img.data;
        const s = (py * w + px) * 4;
        const target = [d[s], d[s + 1], d[s + 2], d[s + 3]];
        const fill = hexToRgba(fillColor);
        if (target.every((v, i) => v === fill[i])) return;
        const TOL = 64;
        const matches = p => Math.abs(d[p] - target[0]) <= TOL && Math.abs(d[p + 1] - target[1]) <= TOL && Math.abs(d[p + 2] - target[2]) <= TOL && Math.abs(d[p + 3] - target[3]) <= TOL;
        const seen = new Uint8Array(w * h);
        const stack = new Int32Array(w * h);
        let top = 0;
        const visit = n => { if (!seen[n]) { seen[n] = 1; if (matches(n * 4)) stack[top++] = n; } };
        visit(py * w + px);
        while (top) {
          const i = stack[--top], p = i * 4, cx = i % w;
          d[p] = fill[0]; d[p + 1] = fill[1]; d[p + 2] = fill[2]; d[p + 3] = 255;
          if (cx > 0) visit(i - 1);
          if (cx < w - 1) visit(i + 1);
          if (i >= w) visit(i - w);
          if (i < w * (h - 1)) visit(i + w);
        }
        pushUndo();
        ctx.putImageData(img, 0, 0);
      }

      function pickColor(x, y, which) {
        if (x < 0 || y < 0 || x >= W || y >= H) return;
        const d = ctx.getImageData(Math.floor(x * DPR), Math.floor(y * DPR), 1, 1).data;
        const hex = "#" + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, "0")).join("");
        if (which === "secondary") setSecondary(hex); else setPrimary(hex);
      }

      // ---------- polygon & curve (click to add points, double-click to finish) ----------
      function cancelPoly() { polyPoints = []; clearCanvas(tctx); }
      function previewPoly(cursor) {
        clearCanvas(tctx);
        if (!polyPoints.length) return;
        const pts = cursor ? [...polyPoints, [cursor.x, cursor.y]] : polyPoints;
        tctx.save();
        tctx.strokeStyle = polyColor;
        tctx.lineWidth = tool === "curve" ? size : 1;
        tctx.lineCap = tctx.lineJoin = "round";
        tctx.beginPath(); tracePath(tctx, pts, tool === "curve"); tctx.stroke();
        tctx.restore();
      }
      function finishPoly() {
        const pts = polyPoints;
        if (tool === "polygon" ? pts.length < 3 : pts.length < 2) return;
        pushUndo();
        if (tool === "polygon") {
          paintShape(ctx, polyColor, g => { tracePath(g, pts, false); g.closePath(); });
          updateStatus("Polygon finished");
        } else {
          ctx.save();
          ctx.strokeStyle = polyColor; ctx.lineWidth = size; ctx.lineCap = ctx.lineJoin = "round";
          ctx.beginPath(); tracePath(ctx, pts, true); ctx.stroke();
          ctx.restore();
          updateStatus("Curve drawn");
        }
        cancelPoly();
      }
      function addPolyPoint(pos, color) {
        const near = (p, r) => p && Math.hypot(pos.x - p[0], pos.y - p[1]) <= r / zoom;
        if (tool === "polygon" && polyPoints.length >= 3 && near(polyPoints[0], 8)) { finishPoly(); return; }
        if (!polyPoints.length) polyColor = color;
        if (!near(polyPoints[polyPoints.length - 1], 3)) polyPoints.push([pos.x, pos.y]);
        previewPoly(pos);
      }
      canvasMain.addEventListener("dblclick", () => { if (tool === "polygon" || tool === "curve") finishPoly(); });

      // ---------- selection (floating, like classic Paint) ----------
      function selCenter(s) { return { x: s.x + s.w / 2, y: s.y + s.h / 2 }; }
      // Point in the selection's own (unrotated) frame
      function toLocal(s, p) {
        const c = selCenter(s), a = -s.angle * Math.PI / 180, dx = p.x - c.x, dy = p.y - c.y;
        return { x: c.x + dx * Math.cos(a) - dy * Math.sin(a), y: c.y + dx * Math.sin(a) + dy * Math.cos(a) };
      }
      function getHandles(s) {
        const c = selCenter(s);
        return [
          { x: s.x, y: s.y, name: "nw" }, { x: s.x + s.w, y: s.y, name: "ne" }, { x: s.x, y: s.y + s.h, name: "sw" }, { x: s.x + s.w, y: s.y + s.h, name: "se" },
          { x: c.x, y: s.y, name: "n" }, { x: c.x, y: s.y + s.h, name: "s" }, { x: s.x, y: c.y, name: "w" }, { x: s.x + s.w, y: c.y, name: "e" },
          { x: c.x, y: s.y >= 20 ? s.y - 20 : s.y + s.h + 20, name: "rotate" }];
      }
      function hitTest(s, p) {
        const l = toLocal(s, p), r = 6 / zoom;
        const h = getHandles(s).find(h => Math.abs(l.x - h.x) <= r && Math.abs(l.y - h.y) <= r);
        if (h) return h.name;
        return l.x >= s.x && l.y >= s.y && l.x <= s.x + s.w && l.y <= s.y + s.h ? "move" : null;
      }
      function withSelTransform(g, s, draw) {
        const c = selCenter(s);
        g.save(); g.translate(c.x, c.y); g.rotate(s.angle * Math.PI / 180); g.translate(-c.x, -c.y);
        draw(); g.restore();
      }
      function drawSelectionImage(g, s) { withSelTransform(g, s, () => g.drawImage(s.img, s.x, s.y, s.w, s.h)); }
      function renderSelection() {
        clearCanvas(sctx); clearCanvas(tctx);
        const s = selection;
        if (!s) return;
        if (s.floating) drawSelectionImage(tctx, s);
        withSelTransform(sctx, s, () => {
          sctx.lineWidth = 1 / zoom;
          sctx.setLineDash([4 / zoom, 3 / zoom]); sctx.strokeStyle = "#000";
          sctx.strokeRect(s.x, s.y, s.w, s.h);
          sctx.setLineDash([]);

          for (const h of getHandles(s)) {
            sctx.fillStyle = "#fff"; sctx.fillRect(h.x - r, h.y - r, 2 * r, 2 * r);
            sctx.strokeRect(h.x - r, h.y - r, 2 * r, 2 * r);

      }
      // Pick the pixels up off the canvas (leaving white behind) the first time a selection is transformed
      function liftSelection() {
        if (selection.floating) return;
        pushUndo();
        fillWhite(selection.x, selection.y, selection.w, selection.h);

      }
      function commitSelection() {
        if (selection && selection.floating) drawSelectionImage(ctx, selection);
        clearSelection();
      }
      function clearSelection() { selection = null; selDrag = null; clearCanvas(sctx); clearCanvas(tctx); }
      // The selection as it currently looks, cropped to its bounding box
      function selectionBitmap() {
        const s = selection, c = selCenter(s), a = s.angle * Math.PI / 180;
        const bw = Math.abs(s.w * Math.cos(a)) + Math.abs(s.h * Math.sin(a)), bh = Math.abs(s.w * Math.sin(a)) + Math.abs(s.h * Math.cos(a));
        const img = document.createElement("canvas");
        img.width = Math.max(1, Math.round(bw * DPR)); img.height = Math.max(1, Math.round(bh * DPR));
        const g = img.getContext("2d");
        g.setTransform(DPR, 0, 0, DPR, 0, 0);

      function copySelection() { if (!selection) return; copied = selectionBitmap(); updateStatus("Copied selection"); }
      function cutSelection() {

        clearSelection();

      }
      function pasteSelection() {
        if (!copied) return;

        // paste at the top-left corner of the visible part of the canvas
        const r = canvasMain.getBoundingClientRect(), v = canvasWrap.getBoundingClientRect();
        const x = Math.round(clampX((v.left - r.left) / zoom)), y = Math.round(clampY((v.top - r.top) / zoom));

        renderSelection();
        updateStatus("Pasted");
      }
      $("copyBtn").addEventListener("click", copySelection);
      $("cutBtn").addEventListener("click", cutSelection);
      $("pasteBtn").addEventListener("click", pasteSelection);

      function updateSelDrag(pos) {
        const s = selection, d = selDrag, o = d.startSel;
        if (d.type === "new") {
          const x1 = clampX(start.x), y1 = clampY(start.y), x2 = clampX(pos.x), y2 = clampY(pos.y);
          Object.assign(s, { x: Math.min(x1, x2), y: Math.min(y1, y2), w: Math.abs(x2 - x1), h: Math.abs(y2 - y1) });
        } else if (d.type === "move") {
          s.x = o.x + pos.x - d.startPos.x; s.y = o.y + pos.y - d.startPos.y;
        } else if (d.type === "rotate") {
          const c = selCenter(o);
          const delta = Math.atan2(pos.y - c.y, pos.x - c.x) - Math.atan2(d.startPos.y - c.y, d.startPos.x - c.x);
          s.angle = o.angle + delta * 180 / Math.PI;
        } else { // resize handle, measured in the selection's own frame
          const a = -o.angle * Math.PI / 180, mx = pos.x - d.startPos.x, my = pos.y - d.startPos.y;
          const dx = mx * Math.cos(a) - my * Math.sin(a), dy = mx * Math.sin(a) + my * Math.cos(a);
          const n = d.handle;
          let { x, y, w, h } = o;
          if (n.includes("w")) { x += dx; w -= dx; }
          if (n.includes("e")) w += dx;
          if (n.includes("n")) { y += dy; h -= dy; }
          if (n.includes("s")) h += dy;
          Object.assign(s, { x, y, w: Math.max(1, w), h: Math.max(1, h) });

      }
      function endSelDrag() {
        if (selDrag.type === "new") {
          const s = selection;
          s.x = Math.round(s.x); s.y = Math.round(s.y); s.w = Math.round(s.w); s.h = Math.round(s.h);
          if (s.w < 1 || s.h < 1) { clearSelection(); return; }
          s.img = snapshotCanvas(s.x, s.y, s.w, s.h);
          updateStatus("Selection created");
        } else updateStatus("Selection transformed");
        selDrag = null;
        renderSelection();
      }

      // ---------- text ----------
      function createTextEditor(x, y, color) {
        const ed = document.createElement("div");
        ed.contentEditable = "true";
        ed.className = "text-editor";
        // position so the editor's text starts exactly at (x, y): 2px padding + 1px border
        ed.style.left = x * zoom - 3 + "px";
        ed.style.top = y * zoom - 3 + "px";
        ed.style.color = color;
        ed.style.fontSize = 16 * zoom + "px";
        ed.style.lineHeight = 20 * zoom + "px";
        ed.style.minHeight = 20 * zoom + "px";
        paper.appendChild(ed);
        textEditor = ed;
        let done = false;
        function finish(keep) {
          if (done) return;
          done = true;
          const lines = ed.innerText.replace(/\n$/, "").split("\n");
          if (keep && lines.join("").trim()) {
            pushUndo();
            ctx.save();
            ctx.fillStyle = color; ctx.font = "16px Tahoma, Geneva, Verdana, sans-serif"; ctx.textBaseline = "middle";
            lines.forEach((line, i) => ctx.fillText(line, x, y + 10 + i * 20));
            ctx.restore();
            updateStatus("Text added");
          }
          ed.remove();
          if (textEditor === ed) textEditor = null;
        }
        ed.finish = finish;
        ed.addEventListener("blur", () => finish(true));
        ed.addEventListener("keydown", e => {
          if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); finish(true); }
          else if (e.key === "Escape") finish(false);
        });
        ed.focus();
      }

      // ---------- pointer input ----------
      canvasMain.addEventListener("contextmenu", e => e.preventDefault());
      canvasMain.addEventListener("mousedown", e => e.preventDefault()); // no text selection / focus stealing
      canvasMain.addEventListener("pointerdown", e => {
        if (activePointer !== null || (e.button !== 0 && e.button !== 2)) return;
        const pos = getPos(e);
        const right = e.button === 2;
        const color = right ? secondary : primary;
        start = { ...pos }; last = { ...pos };
        if (textEditor) { textEditor.finish(true); return; } // first click outside the text box just commits it

        if (tool === "fill") { floodFill(pos.x, pos.y, color); return; }
        if (tool === "eyedrop") { pickColor(pos.x, pos.y, right ? "secondary" : "primary"); return; }
        if (tool === "text") { createTextEditor(pos.x, pos.y, color); return; }
        if (tool === "polygon" || tool === "curve") { addPolyPoint(pos, color); return; }

        activePointer = e.pointerId;
        canvasMain.setPointerCapture(e.pointerId);
        strokeColor = color;
        if (tool === "pencil" || tool === "brush" || tool === "eraser") {
          pushUndo();
          stroke(pos);
        } else if (tool === "select") {
          const hit = selection && hitTest(selection, pos);
          if (hit) {
            liftSelection();
            selDrag = { type: hit === "move" || hit === "rotate" ? hit : "handle", handle: hit, startPos: pos, startSel: { ...selection } };
          } else {
            commitSelection();
            selection = { x: pos.x, y: pos.y, w: 0, h: 0, angle: 0, img: null, floating: false };
            selDrag = { type: "new" };
          }
        }
      });
      function stroke(pos) {
        const color = tool === "eraser" ? "#ffffff" : strokeColor;
        const width = tool === "pencil" ? size : size * 2;
        // a zero-length segment would draw nothing, so nudge the very first dab
        drawLine(ctx, last.x, last.y, pos.x === last.x && pos.y === last.y ? pos.x + 0.01 : pos.x, pos.y, color, width);
        last = { ...pos };
      }
      canvasMain.addEventListener("pointermove", e => {
        const pos = getPos(e);
        statusRight.textContent = Math.floor(clampX(pos.x)) + "," + Math.floor(clampY(pos.y));
        if (activePointer === null) {
          if ((tool === "polygon" || tool === "curve") && polyPoints.length) previewPoly(pos);
          return;
        }
        if (e.pointerId !== activePointer) return;
        if (tool === "pencil" || tool === "brush" || tool === "eraser") stroke(pos);
        else if (tool === "select" && selDrag) updateSelDrag(pos);
        else if (tool === "line" || tool === "rect" || tool === "ellipse") {
          clearCanvas(tctx);
          drawShape(tctx, tool, start, pos, strokeColor);
        }
      });
      function endPointer(e) {
        if (e.pointerId !== activePointer) return;
        activePointer = null;
        const pos = getPos(e);
        if (tool === "select" && selDrag) endSelDrag();
        else if (tool === "line" || tool === "rect" || tool === "ellipse") {
          clearCanvas(tctx);
          pushUndo();
          drawShape(ctx, tool, start, pos, strokeColor);
        }
      }
      canvasMain.addEventListener("pointerup", endPointer);
      canvasMain.addEventListener("pointercancel", endPointer);

      // ---------- keyboard ----------
      window.addEventListener("keydown", e => {
        const t = e.target;
        if (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return; // typing, not a shortcut
        const k = e.key.toLowerCase();
        if (e.ctrlKey || e.metaKey) {
          const actions = { z: undo, y: redo, o: openFile, s: saveAsPNG, c: copySelection, x: cutSelection, v: pasteSelection };
          if (actions[k]) { e.preventDefault(); actions[k](); }
          return;
        }
        if (e.altKey) return;
        const mapping = { p: "pencil", b: "brush", e: "eraser", f: "fill", i: "eyedrop", t: "text", l: "line", r: "rect", o: "ellipse", s: "select", c: "curve", y: "polygon" };
        if (mapping[k]) setTool(mapping[k]);
      });

      // ---------- colour dialog ----------
      function showColorModal() {
        colorModal.style.display = "block";
        colorInput.value = primary; hexInput.value = primary;
        const rgb = hexToRgba(primary);
        rRange.value = rgb[0]; gRange.value = rgb[1]; bRange.value = rgb[2];
      }
      function hideColorModal() { colorModal.style.display = "none"; }
      $("editColorsBtn").addEventListener("click", showColorModal);
      $("editColors").addEventListener("click", showColorModal);
      colorInput.addEventListener("input", () => {
        hexInput.value = colorInput.value;
        const c = hexToRgba(colorInput.value);
        rRange.value = c[0]; gRange.value = c[1]; bRange.value = c[2];
      });
      hexInput.addEventListener("input", () => {
        const v = hexInput.value.trim();
        if (!/^#?[0-9a-fA-F]{6}$/.test(v)) return;
        const hex = (v.startsWith("#") ? v : "#" + v).toLowerCase();
        colorInput.value = hex;
        const c = hexToRgba(hex);
        rRange.value = c[0]; gRange.value = c[1]; bRange.value = c[2];
      });
      [rRange, gRange, bRange].forEach(i => i.addEventListener("input", () => {
        const hex = "#" + [rRange, gRange, bRange].map(r => parseInt(r.value, 10).toString(16).padStart(2, "0")).join("");
        colorInput.value = hex; hexInput.value = hex;
      }));
      $("colorOk").addEventListener("click", () => { setPrimary(colorInput.value); hideColorModal(); });
      $("colorCancel").addEventListener("click", hideColorModal);

      updateStatus("Ready");
      updateUndoButtons();
      window.paintApp = { canvasMain, ctxMainHi: ctx, pushUndo };
    })();
  </script>
</body>

</html>
