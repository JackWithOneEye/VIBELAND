<body>
  <div class="container">
    <div class="outer-border">

        <h1>😢 CRYING BOY 😢</h1>

      <div class="content">

          <canvas id="boy-canvas" role="img" aria-label="An ASCII art oil portrait of a crying boy with a red scarf in a gold frame"></canvas>
        </div>

        <hr class="thick">

        <div class="footer">

        </div>
      </div>
    </div>
  </div>

  <script>
    // An oil portrait of a crying boy in a gilded frame, painted one ASCII character at a time.
    // Every cell averages four samples of a soft-shaded portrait, so features read as painted
    // tones rather than outlines. The face is drawn in surface coordinates (s, y) on a turned,
    // tilted head, so the far side foreshortens naturally.
    const canvas = document.getElementById("boy-canvas");
    const ctx = canvas.getContext("2d");
    const RAMP = " .,-~:;=!*#$@";
    const FONT_SIZE = 7;
    const CELL_H = 7;
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let cellW = 4.2;
    let cols = 0;
    let rows = 0;
    let width = 0;
    let height = 0;
    let padX = 0;
    let padY = 0;
    let scale = 1;
    let centerX = 0;
    let centerY = 0;
    let uMax = 1;
    let vTop = -1;
    let vBot = 1;
    let cells = [];

    // ---------- helpers ----------
    function clamp(x, a, b) {
      return x < a ? a : x > b ? b : x;
    }

    function smooth(a, b, x) {
      const t = clamp((x - a) / (b - a), 0, 1);
      return t * t * (3 - 2 * t);
    }

    function gauss(x, y, sx, sy) {
      return Math.exp(-(x * x / sx + y * y / sy));
    }

    function hash(x, y) {
      let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263);
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }

    function noise(x, y) {
      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const xf = x - xi;
      const yf = y - yi;
      const u = xf * xf * (3 - 2 * xf);
      const v = yf * yf * (3 - 2 * yf);
      const a = hash(xi, yi);
      const b = hash(xi + 1, yi);
      const c = hash(xi, yi + 1);
      const d = hash(xi + 1, yi + 1);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    }

    function fbm(x, y) {
      return noise(x, y) * 0.55 + noise(x * 2.1 + 17, y * 2.1 + 9) * 0.3 + noise(x * 4.3 + 41, y * 4.3 + 3) * 0.15;
    }

    // Brush strokes: noise stretched along a direction.
    function stroke(u, v, a, len) {
      const c = Math.cos(a);
      const s = Math.sin(a);
      return noise((u * c + v * s) * 5, (-u * s + v * c) * len);
    }

    // ---------- the sitter ----------
    const TILT = -0.12;
    const YAW = 0.15;
    const PITCH = 0.03;
    const AMBIENT = 0.5;
    const GAZE = [-0.25, -0.6];
    const SKIN = [0.98, 0.76, 0.6];
    const LIP = [0.88, 0.36, 0.32];
    const IRIS = [0.45, 0.42, 0.26];
    const HAIR = [0.78, 0.62, 0.38];
    const SCARF = [0.62, 0.2, 0.15];
    const COAT = [0.22, 0.24, 0.27];
    const LOCKS = [[-0.22, 0.08, 0.08], [-0.06, 0.12, 0.09], [0.12, 0.14, 0.08], [0.27, 0.07, 0.07]];
    const TEARS = [[1, 0.8, 0.3], [-1, 0.7, 0.36]];
    const LIGHT_LEN = Math.hypot(0.25, 0.3, 0.92);
    const LX = -0.25 / LIGHT_LEN;
    const LY = -0.3 / LIGHT_LEN;
    const LZ = 0.92 / LIGHT_LEN;
    let blink = 0;

    function lit(nx, ny, nz) {
      return Math.max(0, nx * LX + ny * LY + nz * LZ);
    }

    // Each sample writes its colour here.
    let R = 0;
    let G = 0;
    let B = 0;
    function setColor(c, sh) {
      R = c[0] * sh;
      G = c[1] * sh;
      B = c[2] * sh;
    }
    function blend(r, g, b, a) {
      R += (r - R) * a;
      G += (g - G) * a;
      B += (b - B) * a;
    }
    function darken(a) {
      R *= 1 - a;
      G *= 1 - a;
      B *= 1 - a;
    }

    function drawEye(s, y, side, sh) {
      const es = side * 0.16;
      const ey = -0.082 + PITCH + (side > 0 ? 0.006 : 0);
      const dx = (s - es) / 0.09;
      const dy = (y - ey) / 0.047;
      if (dx * dx + dy * dy > 12) return;
      const outer = Math.max(0, dx * side);
      const dyl = dy - 0.3 * outer * outer;
      const e = dx * dx + dyl * dyl * (1 + 0.5 * dx * dx);
      darken(0.22 * gauss(dx * 0.8, dy + 1.8, 0.8, 0.3));

      // The upper lid slides down over the eyeball while he blinks.
      const lidEdge = -1.1 + 2.3 * blink;
      const cover = blink > 0 ? 1 - smooth(lidEdge - 0.12, lidEdge + 0.12, dyl) : 0;
      const m = (1 - smooth(0.8, 1.05, e)) * (1 - cover);
      if (m > 0) {
        const lidShade = 0.45 + 0.55 * smooth(-0.9, 0.5, dyl);
        const base = (0.3 + 0.7 * sh) * lidShade;
        let r = 0.92 * base;
        let g = 0.87 * base;
        let b = 0.83 * base;
        const is = es + GAZE[0] * 0.03;
        const iy = ey + GAZE[1] * 0.02 - 0.006;
        const id = Math.hypot(s - is, y - iy) / 0.043;
        if (id < 1.05) {
          const im = 1 - smooth(0.88, 1.02, id);
          const fibres = 0.8 + 0.2 * Math.sin(Math.atan2(y - iy, s - is) * 13 + id * 4);
          const limbus = 1 - 0.45 * smooth(0.7, 1, id);
          const pupil = 1 - 0.9 * (1 - smooth(0.33, 0.45, id));
          const k = (0.28 + 0.45 * sh) * lidShade * fibres * limbus * pupil;
          r += (IRIS[0] * k - r) * im;
          g += (IRIS[1] * k - g) * im;
          b += (IRIS[2] * k - b) * im;
        }
        const glint = 1.4 * gauss(s - is - 0.012, y - iy + 0.012, 0.00009, 0.00009);
        blend(r + glint, g + glint, b + glint, m);
      }
      const lashes = gauss(0, e - 1, 1, 0.09) * (dyl < 0.2 ? 1 - 0.8 * blink : 0.25);
      blend(0.12 * sh, 0.08 * sh, 0.06 * sh, 0.85 * lashes);
      if (blink > 0) {
        const lidLine = Math.exp(-Math.pow((dyl - lidEdge) / 0.2, 2)) * (1 - smooth(0.85, 1.3, dx * dx)) * Math.min(1, blink * 3);
        blend(0.12 * sh, 0.08 * sh, 0.06 * sh, 0.85 * lidLine);
      }
      if (dyl > 0.2) {
        const wet = gauss(0, e - 0.92, 1, 0.008) * 0.18 * (1 - blink);
        R += wet;
        G += wet * 1.05;
        B += wet * 1.1;
        const rim = gauss(0, e - 1.35, 1, 0.12);
        G -= 0.1 * rim * sh;
        B -= 0.08 * rim * sh;
      }
    }

    function drawBrows(s, y, sh) {
      for (let side = -1; side <= 1; side += 2) {
        const t = (s * side - 0.05) / 0.21;
        if (t < -0.1 || t > 1.1) continue;
        const vb = -0.2 + PITCH - 0.035 * (1 - t) + 0.02 * t - 0.01 * Math.sin(t * Math.PI) + (side > 0 ? -0.008 : 0.004);
        const d = Math.abs(y - vb) / (0.015 * (1 - 0.5 * t) + 0.006);
        const mask = (1 - smooth(0.5, 1.4, d)) * smooth(-0.1, 0.15, t) * (1 - smooth(0.85, 1.1, t)) * (0.6 + 0.4 * noise(s * 90, y * 30)) * 0.9;
        blend(HAIR[0] * 0.35 * sh, HAIR[1] * 0.35 * sh, HAIR[2] * 0.35 * sh, Math.min(1, mask));
      }
    }

    function drawMouth(s, y, sh) {
      const q = (s - 0.012) / 0.095;
      if (Math.abs(q) > 1.4) return;
      const yl = 0.272 + PITCH + 0.03 * q * q + 0.0036 * q;
      const fade = 1 - smooth(0.75, 1.15, Math.abs(q));
      const dy = y - yl;
      const open = 0.0025 * Math.max(0, 1 - q * q);
      const upper = Math.exp(-Math.pow((dy + open + 0.013) / 0.014, 4)) * fade;
      const lower = Math.exp(-Math.pow((dy - open - 0.018) / 0.02, 4)) * fade;
      const line = Math.exp(-Math.pow(dy / Math.max(open, 0.011), 4)) * fade;
      blend(LIP[0] * sh * 0.85, LIP[1] * sh * 0.85, LIP[2] * sh * 0.85, upper * 0.85);
      blend(LIP[0] * sh, LIP[1] * sh, LIP[2] * sh, lower * 0.75);
      const shine = 0.14 * lower * gauss(q, dy - open - 0.009, 0.3, 0.00004);
      R += shine;
      G += shine;
      B += shine;
      blend(0.12 * sh, 0.04 * sh, 0.03 * sh, line);
      darken(0.3 * Math.exp(-(Math.pow(Math.abs(q) - 1, 2) / 0.03 + dy * dy / 0.0002)));
    }

    function drawFace(x, y, k, hrx, hd, s, hairline) {
      const nz = Math.sqrt(Math.max(0, 1 - hd * hd));
      const diffuse = lit(x / hrx, k * 0.6, Math.max(nz, 0.5));
      const sh = 0.42 + 0.5 * diffuse;
      const warm = smooth(0, 0.7, diffuse);
      // Warm in the light, cooler in the shadows, like oil paint.
      R = (0.74 + 0.24 * warm) * sh;
      G = (0.58 + 0.18 * warm) * sh;
      B = (0.5 + 0.1 * warm) * sh;
      const as = Math.abs(s);
      const py = PITCH;
      const fringe = y - hairline;
      if (fringe > 0) darken(0.35 * (1 - smooth(0, 0.08, fringe)));
      const red = 0.6 * gauss(as - 0.19, y - 0.1 - py, 0.012, 0.01) + 0.6 * gauss(s, y - 0.1 - py, 0.002, 0.002) + 0.4 * gauss(as - 0.16, y + 0.04 - py, 0.01, 0.002);
      G -= 0.11 * red * sh;
      B -= 0.09 * red * sh;
      darken(0.38 * gauss(as - 0.16, y + 0.09 - py, 0.014, 0.008));
      darken(0.22 * gauss(as - 0.075, y + 0.07 - py, 0.0012, 0.004));
      darken(0.4 * gauss(s - 0.045, y - 0.06 - py, 0.0012, 0.012));
      const highlight = 0.15 * gauss(s + 0.01, y - 0.1 - py, 0.0008, 0.0015) + 0.1 * gauss(s + 0.2, y - 0.03 - py, 0.006, 0.004);
      R *= 1 + highlight;
      G *= 1 + highlight;
      B *= 1 + highlight;
      darken(0.25 * gauss(as - 0.045, y - 0.12 - py, 0.0008, 0.0008));
      darken(0.75 * gauss(as - 0.03, y - 0.14 - py, 0.0006, 0.0003));
      darken(0.45 * gauss(s, y - 0.165 - py, 0.004, 0.0004));
      darken(0.1 * gauss(s, y - 0.2 - py, 0.0003, 0.0015));
      darken(0.35 * gauss(s - 0.012, y - 0.355 - py, 0.005, 0.0006));
      darken(0.15 * gauss(as - 0.33, y + 0.12, 0.004, 0.02));
      darken(0.15 * gauss(as - 0.03, y + 0.17 - py, 0.0002, 0.002));
      for (let side = -1; side <= 1; side += 2) drawEye(s, y, side, sh);
      drawBrows(s, y, sh);
      drawMouth(s, y, sh);
      for (const tear of TEARS) {
        const side = tear[0];
        const amount = tear[1];
        const tx = side * 0.125 - 0.1 * (y + 0.02) + 0.004 * Math.sin(y * 22);
        const m = Math.exp(-Math.pow((s - tx) / 0.013, 2)) * smooth(-0.04 + py, -0.01 + py, y) * (1 - smooth(0.32, 0.42, y)) * amount;
        const wetTone = Math.max(sh, 0.6);
        blend(0.85 * wetTone, 0.88 * wetTone, 0.92 * wetTone, 0.4 * m);
        const streak = 0.35 * m * Math.exp(-Math.pow((s - tx - 0.004) / 0.003, 2));
        R += streak;
        G += streak;
        B += streak;
        const vd = tear[2];
        const xd = side * 0.125 - 0.1 * (vd + 0.02) + 0.004 * Math.sin(vd * 22);
        const r2 = Math.pow((s - xd) / 0.016, 2) + Math.pow((y - vd) / 0.024, 2);
        const drop = Math.exp(-r2 * r2) * amount;
        blend(0.88 * sh, 0.94 * sh, 0.99 * sh, 0.6 * drop);
        const glint = gauss(s - xd - 0.006, y - vd + 0.009, 0.00003, 0.00003) * amount;
        R += glint;
        G += glint;
        B += glint;
      }
    }

    // Returns true if the sample hit the head: face, hair or ears.
    function drawHead(u, v) {
      const c = Math.cos(TILT);
      const sn = Math.sin(TILT);
      const x = c * u + sn * (v - 0.42);
      const y = 0.42 - sn * u + c * (v - 0.42);
      const k = (y + 0.04) / 0.5;
      const kk = Math.max(0, k);
      const hrx = 0.41 * (1 - 0.16 * kk * kk);
      const p = k > 0 ? 2.2 : 2;
      const hd = Math.pow(Math.pow(Math.abs(x / hrx), p) + Math.pow(Math.abs(k), p), 1 / p);
      const inHead = hd < 1;
      const s = inHead ? (Math.asin(clamp(x / hrx, -1, 1)) - YAW) * 0.42 : 0;
      let hairline = -0.3 + 0.1 * (s / 0.4) * (s / 0.4) + 0.04;
      for (const lock of LOCKS) hairline = Math.max(hairline, -0.26 + lock[1] * Math.max(0, 1 - Math.abs(s - lock[0]) / lock[2]));

      const hv = y + 0.2;
      const ha = Math.atan2(hv, x - 0.04);
      const hr = Math.hypot((x - 0.04) / 0.5, hv / 0.52);
      const tuft = clamp((0.02 - y) / 0.35, 0, 1);
      const hrMod = 1 + tuft * (0.055 * Math.sin(ha * 7 + 8.9) + 0.035 * Math.sin(ha * 13 + 17.8) + 0.08 * (noise(ha * 2.5 + 8.9, 3) - 0.5));
      const temple = inHead && Math.abs(s) > 0.41 + 0.5 * Math.max(0, y + 0.15) + 0.03 * Math.sin(y * 45 + 8.9) && y < 0;
      if (hr < hrMod && y < 0.02 && (!inHead || y < hairline || temple)) {
        const nx = (x - 0.04) / 0.5;
        const ny = hv / 0.52;
        const hnz = Math.sqrt(Math.max(0.05, 1 - nx * nx - ny * ny));
        const flow = Math.PI / 2 - 1.1 * (x - 0.04) + 1.4 * (noise(x * 4 + 8.9, y * 4) - 0.5);
        const strands = stroke(x, y, flow, 70) - 0.5;
        const clumps = fbm(x * 7 + 8.9, y * 5);
        setColor(HAIR, (AMBIENT * 0.8 + 0.8 * lit(nx, ny, hnz)) * (0.55 + 0.75 * clumps + 0.35 * strands) * clamp((hrMod - hr) * 6, 0.7, 1));
        return true;
      }
      if (inHead) {
        drawFace(x, y, k, hrx, hd, s, hairline);
        return true;
      }
      // The near ear sits on the silhouette; the far one peeks out from behind the head.
      for (let side = -1; side <= 1; side += 2) {
        const ex = (x - side * 0.4 * Math.cos(YAW) - side * 0.02) / 0.06;
        const ey = (y + 0.02) / 0.1;
        if (ex * ex + ey * ey < 1) {
          setColor(SKIN, (AMBIENT + 0.6 * lit(side * 0.8, 0, 0.6)) * (side < 0 ? 1 : 0.8) * (1 - 0.35 * gauss(ex - side * 0.2, ey, 0.15, 0.3)));
          return true;
        }
      }
      return false;
    }

    // Returns true if the sample hit the neck, scarf or coat.
    function drawBody(u, v) {
      const au = Math.abs(u);
      const scarfTop = 0.45 + 0.03 * Math.sin(u * 7 + 1);
      if (v < scarfTop && au < 0.17 && v > 0.3) {
        setColor(SKIN, (AMBIENT + 0.5 * clamp((v - 0.4) / 0.3, 0, 1)) * (1 - 0.35 * clamp((u + 0.15) / 0.3, 0, 1)));
        return true;
      }
      const q = u / 0.37;
      const bottom = 0.6 + 0.08 * (1 - q * q);
      const endX = 0.2 + (v - 0.6) * 0.08;
      const inBand = v > scarfTop && v < bottom && Math.abs(q) < 1;
      const inEnd = v > 0.62 && v < 1.15 && Math.abs(u - endX) < 0.085;
      if (inBand || (inEnd && !(v > 1.08 && Math.sin(u * 90) < 0))) {
        const knit = 0.8 + 0.25 * Math.abs(Math.sin(u * 70 + Math.sin(v * 50) * 0.8));
        const tube = inBand ? 0.75 + 0.45 * Math.sin(Math.PI * clamp((v - scarfTop) / (bottom - scarfTop), 0, 1)) * Math.sqrt(1 - q * q) : 0.85;
        setColor(SCARF, (AMBIENT + 0.7 * lit(q * 0.7, -0.2, 0.7)) * knit * tube * (!inBand && Math.abs(u - endX) > 0.065 ? 0.6 : 1));
        return true;
      }
      const sx = u / 0.95;
      const sy = (v - 1.07 - 0.04 * u) / 0.55;
      if (sx * sx + sy * sy > 1 || v < 0.5) return false;
      const nz = Math.sqrt(Math.max(0, 1 - sx * sx - sy * sy));
      setColor(COAT, (AMBIENT + 0.7 * lit(sx, sy, nz)) * (0.8 + 0.35 * stroke(u, v, 1.2 + u, 22)));
      return true;
    }

    function drawFrame(u, v) {
      const de = Math.min(uMax - Math.abs(u), v - vTop, vBot - v);
      if (de >= 0.075) return false;
      const t = de / 0.075;
      const along = de === v - vTop || de === vBot - v ? u : v;
      const litSide = de === v - vTop || (de === uMax - Math.abs(u) && u < 0) ? 1.15 : 0.8;
      let sh = (0.35 + 0.45 * Math.sin(t * Math.PI)) * litSide;
      if (t > 0.35 && t < 0.65) sh *= 0.75 + 0.45 * (0.5 + 0.5 * Math.sin(along * 70));
      if (t > 0.88) sh *= 0.35;
      setColor([1, 0.78, 0.32], sh);
      return true;
    }

    function sample(u, v) {
      if (drawFrame(u, v)) return;
      if (drawHead(u, v) || drawBody(u, v)) {
        const brush = 0.94 + 0.12 * stroke(u, v, 0.6, 30);
        R *= brush;
        G *= brush;
        B *= brush;
        return;
      }
      // Dark umber background with a glow on the lit side.
      const glow = gauss(u + 0.35, v + 0.2, 0.35, 0.5);
      const l = (0.04 + 0.06 * fbm(u * 2.2, v * 2.2) + 0.1 * glow) * (0.85 + 0.3 * stroke(u, v, 2.2, 18));
      R = 0.68 * l;
      G = 0.52 * l;
      B = 0.3 * l;
    }

    // ---------- rendering ----------
    function colorString(r, g, b) {
      return "rgb(" + Math.round(clamp(r, 0, 1) * 255) + "," + Math.round(clamp(g, 0, 1) * 255) + "," + Math.round(clamp(b, 0, 1) * 255) + ")";
    }

    function paintCell(row, col) {
      const u = (padX + (col + 0.5) * cellW - centerX) / scale;
      const v = (padY + (row + 0.5) * CELL_H - centerY) / scale;
      const ox = cellW / 4 / scale;
      const oy = CELL_H / 4 / scale;
      let r = 0;
      let g = 0;
      let b = 0;
      for (let j = 0; j < 4; j++) {
        sample(u + (j & 1 ? ox : -ox), v + (j & 2 ? oy : -oy));
        r += R;
        g += G;
        b += B;
      }
      r /= 4;
      g /= 4;
      b /= 4;
      const lum = 0.3 * r + 0.59 * g + 0.11 * b;
      const L = 1 - Math.exp(-Math.max(0, lum - 0.05) * 2.7);
      const idx = Math.min(RAMP.length - 1, Math.round(Math.pow(L, 0.85) * (RAMP.length - 1)));
      const x = padX + col * cellW;
      const y = padY + row * CELL_H;
      ctx.fillStyle = "#000";
      ctx.fillRect(x, y, cellW, CELL_H);
      if (idx < 1) return;
      const boost = (0.45 + 0.75 * L) / Math.max(lum, 0.02);
      ctx.fillStyle = colorString(r * boost, g * boost, b * boost);
      ctx.fillText(RAMP[idx], x, y);
    }

    // Cells whose samples can touch the eyes; only these are repainted during a blink.
    let eyeRows = [0, 0];
    let eyeCols = [0, 0];

    function render() {
      const dpr = window.devicePixelRatio || 1;
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.font = FONT_SIZE + "px 'Courier New', Courier, monospace";
      ctx.textBaseline = "top";
      cellW = ctx.measureText("M").width;
      cols = Math.floor(width / cellW);
      rows = Math.floor(height / CELL_H);
      padX = (width - cols * cellW) / 2;
      padY = (height - rows * CELL_H) / 2;
      scale = height / 1.65;
      centerX = width / 2;
      centerY = 0.8 * scale;
      uMax = width / 2 / scale;
      vTop = -centerY / scale;
      vBot = (height - centerY) / scale;
      eyeCols = [Math.max(0, Math.floor((centerX - 0.42 * scale - padX) / cellW)), Math.min(cols - 1, Math.ceil((centerX + 0.48 * scale - padX) / cellW))];
      eyeRows = [Math.max(0, Math.floor((centerY - 0.3 * scale - padY) / CELL_H)), Math.min(rows - 1, Math.ceil((centerY + 0.08 * scale - padY) / CELL_H))];

      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, width, height);
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) paintCell(row, col);
      }
    }

    function renderEyes() {
      for (let row = eyeRows[0]; row <= eyeRows[1]; row++) {
        for (let col = eyeCols[0]; col <= eyeCols[1]; col++) paintCell(row, col);
      }
    }

    // ---------- the gimmick: a rare blink ----------
    // Every ten seconds there is a one in five chance that he blinks.
    const BLINK_CLOSE = 0.09;
    const BLINK_HOLD = 0.05;
    const BLINK_OPEN = 0.15;
    let blinkStart = 0;

    function blinkFrame(now) {
      const t = (now - blinkStart) / 1000;
      if (t < BLINK_CLOSE) blink = t / BLINK_CLOSE;
      else if (t < BLINK_CLOSE + BLINK_HOLD) blink = 1;
      else blink = Math.max(0, 1 - (t - BLINK_CLOSE - BLINK_HOLD) / BLINK_OPEN);
      blink = blink * blink * (3 - 2 * blink);
      renderEyes();
      if (t < BLINK_CLOSE + BLINK_HOLD + BLINK_OPEN) requestAnimationFrame(blinkFrame);
    }

    if (!reducedMotion) {
      setInterval(function () {
        if (Math.random() < 0.2 && !document.hidden) {
          blinkStart = performance.now();
          requestAnimationFrame(blinkFrame);
        }
      }, 10000);
    }

    render();
    window.addEventListener("resize", render);
  </script>
</body>
</html>
