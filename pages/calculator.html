<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator - VIBELAND</title>
  <link rel="stylesheet" type="text/css" href="../assets/styles.css">
  <style>
    .calculator {
      width: 390px;
      margin-left: auto;
      margin-right: auto;
    }

    button {
      padding: 10px 0;
      font-size: 1rem;
    }

    button.zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="outer-border">
      <div class="header">
        <h1>🔢 CALCULATOR 🔢</h1>
        <p>~*~ Scientific Computing for the Modern Age ~*~</p>
      </div>

      <div class="ticker" aria-label="site news">
        <div class="marquee">★ WELCOME TO VIBELAND ★ CRUNCH NUMBERS LIKE A PRO ★ SUPPORTS TRIG & LOGARITHMS ★</div>
      </div>

      <div class="content">
        <div class="calculator">
          <div class="display-container">
            <input type="text" id="display" class="display" value="0" readonly />
          </div>
          <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="input('(')">(</button>
            <button onclick="input(')')">)</button>
            <button onclick="input('%')">%</button>
            <button onclick="backspace()">⟵</button>

            <button class="func" onclick="inputFunc('sin')">sin</button>
            <button class="func" onclick="inputFunc('cos')">cos</button>
            <button class="func" onclick="inputFunc('tan')">tan</button>
            <button class="func" onclick="inputFunc('log')">log</button>
            <button onclick="inputOperator('/')">÷</button>

            <button onclick="input('7')">7</button>
            <button onclick="input('8')">8</button>
            <button onclick="input('9')">9</button>
            <button class="func" onclick="inputFunc('sqrt')">√</button>
            <button onclick="inputOperator('*')">×</button>

            <button onclick="input('4')">4</button>
            <button onclick="input('5')">5</button>
            <button onclick="input('6')">6</button>
            <button class="func" onclick="inputOperator('^')">^</button>
            <button onclick="inputOperator('-')">−</button>

            <button onclick="input('1')">1</button>
            <button onclick="input('2')">2</button>
            <button onclick="input('3')">3</button>
            <button class="func" onclick="input('pi')">π</button>
            <button onclick="inputOperator('+')">+</button>

            <button onclick="input('0')" class="zero">0</button>
            <button onclick="input('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
          </div>
        </div>
        
        <hr class="thick">
        
        <div class="footer">
          <div><a href="../home">← Back to VIBELAND</a></div>
          <div>© 1999 VIBELAND - All Rights Reserved</div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    let display = document.getElementById('display');
    let expr = "";
    let lastWasResult = false;
    let lastResult = 0;
    let lastCalculation = "";

    function input(val) {
      if (lastWasResult) {
        expr = "";
        lastWasResult = false;
      }
      if (expr === "0") expr = "";
      if (val === "pi") val = "π";
      expr += val;
      updateDisplay();
    }

    function inputOperator(op) {
      if (lastWasResult || expr === "" || expr === "Error") {
        expr = (isNaN(lastResult) ? "0" : lastResult.toString()) + op;
        lastWasResult = false;
      } else {
        expr += op;
      }
      updateDisplay();
    }

    function inputFunc(func) {
      if (expr === "" || expr === "Error") {
        expr = func + "(";
        lastWasResult = false;
      } else if (lastWasResult) {
        expr = func + "(" + (isNaN(lastResult) ? "0" : lastResult.toString()) + ")";
        lastWasResult = false;
      } else {
        expr += func + "(";
      }
      updateDisplay();
    }

    function updateDisplay() {
      display.value = expr || "0";
    }

    function clearDisplay() {
      expr = "";
      lastWasResult = false;
      updateDisplay();
    }

    function backspace() {
      if (expr === "Error") expr = "";
      expr = expr.slice(0, -1);
      lastWasResult = false;
      updateDisplay();
    }

    const FUNCS = {sin: Math.sin, cos: Math.cos, tan: Math.tan, log: Math.log10, sqrt: Math.sqrt};

    // Recursive-descent evaluator: + - (lowest), * /, unary -, ^ (right-associative), % (postfix)
    function compute(str) {
      const NUMBER = /^(?:(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?|Infinity)$/;
      const tokens = str.match(/(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?|Infinity|[a-z]+|\S/g) || [];
      let pos = 0;
      const peek = () => tokens[pos];
      const next = () => tokens[pos++];
      const expect = (t) => {
        if (next() !== t) throw new Error("Syntax error");
      };

      function parseSum() {
        let value = parseProduct();
        while (peek() === "+" || peek() === "-") {
          value = next() === "+" ? value + parseProduct() : value - parseProduct();
        }
        return value;
      }

      function parseProduct() {
        let value = parseUnary();
        while (peek() === "*" || peek() === "/") {
          value = next() === "*" ? value * parseUnary() : value / parseUnary();
        }
        return value;
      }

      function parseUnary() {
        if (peek() === "-") { next(); return -parseUnary(); }
        if (peek() === "+") { next(); return parseUnary(); }
        return parsePower();
      }

      function parsePower() {
        const base = parsePercent();
        if (peek() === "^") { next(); return Math.pow(base, parseUnary()); }
        return base;
      }

      function parsePercent() {
        let value = parsePrimary();
        while (peek() === "%") { next(); value /= 100; }
        return value;
      }

      function parsePrimary() {
        const t = next();
        if (t === undefined) throw new Error("Syntax error");
        if (NUMBER.test(t)) return parseFloat(t);
        if (t === "π") return Math.PI;
        if (t === "(") {
          const value = parseSum();
          expect(")");
          return value;
        }
        if (Object.hasOwn(FUNCS, t)) {
          expect("(");
          const value = parseSum();
          expect(")");
          return FUNCS[t](value);
        }
        throw new Error("Syntax error");
      }

      const result = parseSum();
      if (pos !== tokens.length) throw new Error("Syntax error");
      return result;
    }

    function calculate() {
      let toEval;
      if (lastWasResult && lastCalculation) {
        toEval = lastCalculation;
      } else {
        toEval = expr;
        lastCalculation = toEval;
      }
      try {
        let result = compute(toEval);
        if (typeof result === "number" && !Number.isInteger(result)) {
          result = result.toFixed(9).replace(/\.?0+$/, "");
        }
        expr = result.toString();
        lastResult = (typeof result === "string") ? Number(result) : result;
        lastWasResult = true;
      } catch (e) {
        expr = "Error";
        lastResult = 0;
        lastWasResult = true;
      }
      updateDisplay();
    }

    document.addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey || e.altKey) && !e.getModifierState("AltGraph")) return;
      const k = e.key;
      if (k >= "0" && k <= "9" && k.length === 1) input(k);
      else if (k === "." || k === "(" || k === ")" || k === "%") input(k);
      else if (k === "+" || k === "-" || k === "*" || k === "/" || k === "^") inputOperator(k);
      else if (k === "C" || k === "Escape" || k === "Delete") clearDisplay();
      else if (k === "Backspace") backspace();
      else if (k === "Enter" || k === "=") calculate();
      else if (k === "s") inputFunc("sin");
      else if (k === "c") inputFunc("cos");
      else if (k === "t") inputFunc("tan");
      else if (k === "l") inputFunc("log");
      else if (k === "r") inputFunc("sqrt");
      else if (k === "p") input("pi");
      else return;
      e.preventDefault();
    });
  </script>
</body>
</html>
