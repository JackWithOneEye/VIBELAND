<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>VIBELAND - Mahjong Solitaire</title>
  <link rel="stylesheet" type="text/css" href="../assets/styles.css">
  <style>
    :root {
      --tile-w: 60px;
      --tile-h: 80px;
      --z-elev-x: 3px;
      --z-elev-y: 3px;
    }

    .container {
      width: 1080px;
    }

    .game-section {
      background-color: #2d6b3f;
      border: 2px inset #c0c0c0;
      padding: 20px;
      margin: 20px 0;
      text-align: center;
    }

    #difficulty-select {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .diff-btn {
      padding: 10px 20px;
    }

    #hud {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 14px;
    }

    .stat {
      background-color: #ffffff;
      border: 2px inset #c0c0c0;
      padding: 8px 15px;
    }

    .stat strong {
      color: #000080;
    }

    #controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #controls button {
      padding: 8px 16px;
      font-size: 14px;
    }

    /* Fits the longest design name, so cycling designs never shifts the row */
    #tile-theme {
      min-width: 15em;
    }

    #game-container {
      position: relative;
      margin: 20px auto;
      display: flex;
      justify-content: center;
    }

    #board {
      position: relative;
      margin: 0 auto;
    }

    .tile {
      position: absolute;
      width: var(--tile-w);
      height: var(--tile-h);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.3s;
      user-select: none;
    }

    /* The tile design (assets/mahjong-themes.js) sets each tile's background, border and shadow. */
    .tile-inner {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tile.free {
      cursor: pointer;
    }

    .tile.blocked {
      cursor: default;
    }

    .tile.selected .tile-inner {
      transform: scale(1.1);
      box-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
      border-color: #ff0000;
    }

    .tile.matching {
      animation: match 0.4s ease-out forwards;
    }

    @keyframes match {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.2) translateY(-10px);
        opacity: 0.8;
      }

      100% {
        transform: scale(0);
        opacity: 0;
      }
    }

    .tile.hint .tile-inner {
      animation: hint-pulse 1s ease-in-out infinite;
    }

    @keyframes hint-pulse {

      0%,
      100% {
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      }

      50% {
        box-shadow: 0 0 25px rgba(255, 215, 0, 1);
      }
    }

    #message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #c0c0c0;
      border: 2px outset #c0c0c0;
      padding: 30px 50px;
      font-size: 1.5em;
      text-align: center;
      display: none;
      z-index: 100000;
      color: #000080;
      font-weight: bold;
    }

    #message.show {
      display: block;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translate(-50%, -60%);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }

    svg.tile-face {
      width: 90%;
      height: 90%;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="outer-border">
      <div class="header">
        <h1>🀄 MAHJONG SOLITAIRE 🀄</h1>
        <p>~*~ Match the Tiles ~*~</p>
      </div>

      <div class="ticker" aria-label="site news">
        <div class="marquee">★ WELCOME TO VIBELAND ★ CLASSIC TILE MATCHING PUZZLE ★ CLEAR ALL TILES TO WIN ★</div>
      </div>

      <div class="content">
        <div class="game-section">
          <div id="difficulty-select">
            <button class="diff-btn active" data-diff="easy">Easy</button>
            <button class="diff-btn" data-diff="normal">Normal</button>
            <button class="diff-btn" data-diff="hard">Hard</button>
          </div>

          <div id="hud">
            <div class="stat">Score: <strong id="score">0</strong></div>
            <div class="stat">Moves: <strong id="moves">0</strong></div>
            <div class="stat">Pairs Left: <strong id="pairs-left">0</strong></div>
            <div class="stat">Removable Pairs: <strong id="available-pairs">0</strong></div>
            <div class="stat">Time: <strong id="timer">0:00</strong></div>
          </div>

          <div id="controls">
            <button id="new-game">New Game</button>
            <button id="hint">Hint (-50pts)</button>
            <button id="shuffle">Shuffle (-100pts)</button>
            <button id="undo">Undo</button>
            <button id="tile-theme">Tiles</button>
          </div>

          <div id="game-container">
            <div id="board"></div>
          </div>
        </div>

        <hr class="thick">

        <div class="footer">
          <div><a href="../home">← Back to VIBELAND</a></div>
          <div>© 1999 VIBELAND - All Rights Reserved</div>
        </div>
      </div>
    </div>
  </div>

  <div id="message"></div>

  <svg id="sprite" xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs></defs>
  </svg>

  <script src="../assets/mahjong-themes.js"></script>
  <script src="../assets/mahjong.js"></script>
</body>

</html>
